<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>E-Receipt Builder</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d4af37">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="E-Receipt">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #eef2f5;
      font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, 'Roboto', monospace;
      padding: 2rem 1.5rem;
    }

    .dashboard {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
    }

    .form-panel {
      flex: 1.1;
      min-width: 280px;
      background: white;
      border-radius: 28px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.08);
      padding: 1.8rem 2rem;
    }

    .form-panel h2 {
      font-size: 1.6rem;
      font-weight: 600;
      color: #1e2a3a;
      border-left: 5px solid #d4af37;
      padding-left: 1rem;
      margin-bottom: 1.6rem;
      letter-spacing: -0.3px;
    }

    .input-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.2rem 1.5rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #2c5f7a;
    }

    .field input,
    .field select {
      background: #f9fbfd;
      border: 1px solid #cfdfe9;
      border-radius: 16px;
      padding: 10px 14px;
      font-size: 0.95rem;
      font-family: inherit;
      transition: 0.2s;
      outline: none;
    }

    .field input:focus,
    .field select:focus {
      border-color: #d4af37;
      box-shadow: 0 0 0 3px rgba(212,175,55,0.2);
      background: white;
    }

    .field.estate-field select {
      border-color: #d4af37;
      background: #fffbee;
      font-weight: 700;
      color: #1e2a3a;
    }

    .code-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .code-prefix {
      background: #eaf3f9;
      border: 1px solid #cfdfe9;
      border-radius: 16px;
      padding: 10px 14px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #2c5f7a;
      white-space: nowrap;
      min-width: 90px;
      text-align: center;
    }

    .code-num { flex: 1; }

    .spinner-wrap {
      display: flex;
      align-items: center;
      gap: 0;
      flex: 1;
    }

    .spinner-wrap input[type="number"] {
      width: 90px;
      border-radius: 16px 0 0 16px;
      border-right: none;
      text-align: center;
      font-weight: 700;
      -moz-appearance: textfield;
    }

    .spinner-wrap input[type="number"]::-webkit-outer-spin-button,
    .spinner-wrap input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .spinner-btns {
      display: flex;
      flex-direction: column;
      border: 1px solid #cfdfe9;
      border-radius: 0 16px 16px 0;
      overflow: hidden;
    }

    .spin-btn {
      background: #eaf3f9;
      border: none;
      padding: 4px 10px;
      font-size: 0.65rem;
      cursor: pointer;
      color: #2c5f7a;
      line-height: 1;
      transition: background 0.15s;
    }

    .spin-btn:hover { background: #d4af37; color: white; }
    .spin-btn:first-child { border-bottom: 1px solid #cfdfe9; }

    .receipt-area {
      flex: 1.2;
      min-width: 360px;
      background: transparent;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .receipt-card {
      background: #fffef7;
      background-image: linear-gradient(to bottom, #ffffff, #fefaf0);
      border-radius: 28px;
      box-shadow: 0 20px 35px -12px rgba(0,0,0,0.2);
      padding: 2rem 2rem 1.8rem;
      border: 1px solid #f3e5c9;
      font-family: 'Courier New', 'Fira Code', 'Segoe UI', monospace;
    }

    .receipt-header {
      text-align: center;
      border-bottom: 2px dashed #c0b28a;
      margin-bottom: 1rem;
      padding-bottom: 0.8rem;
    }

    .apt-name {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #2c3e2f;
      text-transform: uppercase;
      font-family: 'Segoe UI', system-ui;
    }

    .apt-location {
      font-size: 0.82rem;
      color: #7a6030;
      margin-top: 3px;
      letter-spacing: 0.5px;
    }

    .thanks-tag {
      font-style: italic;
      font-size: 0.9rem;
      color: #6b4c2c;
      margin-top: 4px;
    }

    .badge-receipt {
      font-size: 1.4rem;
      font-weight: bold;
      text-align: center;
      letter-spacing: 6px;
      color: #b77c2e;
      margin: 10px 0 8px;
      border-bottom: 1px dotted #e2d5b6;
      padding-bottom: 8px;
    }

    .receipt-row {
      margin: 10px 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      border-bottom: 1px dotted #e2d5b6;
      padding-bottom: 6px;
      font-size: 0.95rem;
    }

    .receipt-row span:first-child {
      font-weight: 700;
      color: #4a3727;
    }

    .inline-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 1rem;
      margin: 10px 0;
      font-size: 0.92rem;
      background: #fdf8ec;
      padding: 8px 12px;
      border-radius: 20px;
    }

    .highlight { font-weight: 800; color: #1e5631; }

    .amount-large {
      font-size: 1.2rem;
      font-weight: 800;
      background: #f9efcf;
      display: inline-block;
      padding: 0 6px;
      border-radius: 20px;
    }

    .receipt-footer {
      margin-top: 1.3rem;
      padding-top: 0.8rem;
      border-top: 1px solid #e2d5b6;
      font-size: 0.75rem;
      text-align: center;
      color: #5f5b4b;
    }

    .contact-line {
      font-size: 0.72rem;
      font-family: monospace;
      background: #faf3e0;
      padding: 10px 12px;
      border-radius: 20px;
      margin-top: 12px;
      text-align: center;
      line-height: 1.9;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin-top: 0.5rem;
    }

    .btn {
      border: none;
      background: #1f3e34;
      color: white;
      padding: 12px 28px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .btn-pdf   { background: #b7410e; }
    .btn-image { background: #2c5f7a; }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
      box-shadow: 0 8px 18px rgba(0,0,0,0.13);
    }

    .small-note {
      font-size: 0.7rem;
      text-align: center;
      margin-top: 12px;
      color: #6a6f6d;
    }

    @media (max-width: 780px) {
      body { padding: 1rem; }
      .receipt-card { padding: 1.5rem; }
      .apt-name { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

<div class="dashboard">

  <!-- LEFT: form -->
  <div class="form-panel">
    <h2>📄 RECEIPT DETAILS</h2>
    <div class="input-grid">

      <div class="field estate-field" style="grid-column:1/-1;">
        <label>🏢 Select Estate</label>
        <select id="estateName">
          <option value="HNA">HN Apartments — Kyanja</option>
          <option value="KKE">KK Estate — Kabalagala</option>
          <option value="KIE">Kitinda Estate — Entebbe</option>
          <option value="RUE2">Ruter Estate — Lubowa / Garuga</option>
          <option value="NAC">Nakku Courts — Kisugu</option>
          <option value="RAE">Rashid Estate — Kisugu</option>
        </select>
      </div>

      <div class="field" style="grid-column:1/-1;">
        <label>🧾 Receipt No. (prefix is automatic — enter number only)</label>
        <div class="code-row">
          <div class="code-prefix" id="codePrefix">HNA:</div>
          <div class="spinner-wrap">
            <input type="number" id="receiptNumber" min="1" step="1" placeholder="1" value="1">
            <div class="spinner-btns">
              <button type="button" class="spin-btn" id="spinUp">▲</button>
              <button type="button" class="spin-btn" id="spinDown">▼</button>
            </div>
          </div>
        </div>
        <div id="lastSavedLabel" style="margin-top:6px;font-size:0.82rem;color:#888;">Last saved: <strong id="lastSavedValue">None</strong></div>
      </div>

      <div class="field">
        <label>📅 Date</label>
        <input type="date" id="receiptDate">
      </div>
      <div class="field">
        <label>👤 M/S (Tenant name)</label>
        <input type="text" id="tenantName" placeholder="e.g., John Otieno" value="Victoria Wanjiku">
      </div>
      <div class="field">
        <label>📆 Payment for month(s) of</label>
        <input type="text" id="paymentMonth" placeholder="e.g., April 2026" value="April 2026">
      </div>
      <div class="field">
        <label>💰 Total Paid (UGX)</label>
        <input type="number" id="totalAmount" step="1000" placeholder="Shillings" value="125000">
      </div>
      <div class="field">
        <label>💵 Cash / Bank</label>
        <input type="text" id="cashCheque" placeholder="Cash / Bank" value="Bank">
      </div>
      <div class="field">
        <label>✍️ Signed by</label>
        <input type="text" id="signedBy" placeholder="Manager / Tenant" value="Karen-mgmt">
      </div>
      <div class="field">
        <label>⚖️ Balance Due (UGX)</label>
        <input type="number" id="balanceDue" step="0.01" placeholder="0.00" value="0">
      </div>
    </div>
    <div class="small-note" style="margin-top:1rem;">
      ✨ Fields update the receipt preview in real time.
    </div>
  </div>

  <!-- RIGHT: preview + export -->
  <div class="receipt-area">
    <div class="receipt-card" id="receiptContainer">
      <div id="liveReceipt"></div>
    </div>

    <div class="button-group">
      <button class="btn btn-image" id="saveImageBtn">📸 Save as IMAGE (PNG)</button>
      <button class="btn btn-pdf"   id="savePdfBtn">📑 Save as PDF</button>
    </div>
    <div class="small-note">
      ✅ File will be named by receipt number (e.g. <strong>HNA0001.pdf</strong>).<br>
      After downloading, move it to:<br>
      <span id="folderHint" style="font-family:monospace; color:#2c5f7a; font-weight:600;">D:\my legal issues 2026\E-RECEIPTS\HN Apartments - Kyanja</span>
    </div>
  </div>
</div>

<script>
  var ESTATES = {
    'HNA':  { name: 'HN APARTMENTS',  location: 'Kyanja',          tel: '0758778469 | 0704934823', prefix: 'HNA:',  folder: 'HN Apartments - Kyanja'       },
    'KKE':  { name: 'KK ESTATE',      location: 'Kabalagala',      tel: '0758778469 | 0704934823', prefix: 'KKE:',  folder: 'KK Estate - Kabalagala'       },
    'KIE':  { name: 'KITINDA ESTATE', location: 'Entebbe',         tel: '0758778469 | 0704934823', prefix: 'KIE:',  folder: 'Kitinda Estate - Entebbe'     },
    'RUE2': { name: 'RUTER ESTATE',   location: 'Lubowa | Garuga', tel: '0758778469 | 0704934823', prefix: 'RUE2:', folder: 'Ruter Estate - Garuga_Lubowa'  },
    'NAC':  { name: 'NAKKU COURTS',   location: 'Kisugu',          tel: '0758778469',              prefix: 'NAC:',  folder: 'Nakku Courts - Kisugu'        },
    'RAE':  { name: 'RASHID ESTATE',  location: 'Kisugu',          tel: '0758778469',              prefix: 'RAE:',  folder: 'Rashid Estate - Kisugu'       }
  };

  var DEFAULT_EMAIL = 'karungikeren179@gmail.com';

  var estateSelect    = document.getElementById('estateName');
  var codePrefixEl    = document.getElementById('codePrefix');
  var receiptNoInput  = document.getElementById('receiptNumber');
  var dateInput       = document.getElementById('receiptDate');
  var monthInput      = document.getElementById('paymentMonth');
  var tenantInput     = document.getElementById('tenantName');
  var amountInput     = document.getElementById('totalAmount');
  var cashChequeInput = document.getElementById('cashCheque');
  var signedInput     = document.getElementById('signedBy');
  var balanceInput    = document.getElementById('balanceDue');
  var liveReceiptDiv  = document.getElementById('liveReceipt');

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function setDefaultDate() {
    if (!dateInput.value) {
      var t = new Date();
      var y = t.getFullYear();
      var m = String(t.getMonth()+1).padStart(2,'0');
      var d = String(t.getDate()).padStart(2,'0');
      dateInput.value = y + '-' + m + '-' + d;
    }
  }

  function formatDate(raw) {
    if (!raw) return '____';
    var p = raw.split('-');
    if (p.length !== 3) return raw;
    var d = new Date(+p[0], +p[1]-1, +p[2]);
    if (isNaN(d)) return raw;
    return d.toLocaleDateString('en-GB', {year:'numeric', month:'short', day:'numeric'});
  }

  function numberToWords(num) {
    if (isNaN(num) || num === 0) return 'Zero';
    var ones = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine',
                'Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen',
                'Seventeen','Eighteen','Nineteen'];
    var tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
    function cvt(n) {
      if (n === 0) return '';
      if (n < 20)  return ones[n] + ' ';
      if (n < 100) return tens[Math.floor(n/10)] + (n%10 ? '-'+ones[n%10] : '') + ' ';
      return ones[Math.floor(n/100)] + ' Hundred ' + cvt(n % 100);
    }
    var r = Math.floor(num), result = '';
    if (r >= 1000000) { result += cvt(Math.floor(r/1000000)) + 'Million '; r %= 1000000; }
    if (r >= 1000)    { result += cvt(Math.floor(r/1000))    + 'Thousand '; r %= 1000; }
    result += cvt(r);
    return result.trim() || 'Zero';
  }

  function updatePrefix() {
    var estate = ESTATES[estateSelect.value];
    if (estate) {
      codePrefixEl.textContent = estate.prefix;
      var hint = document.getElementById('folderHint');
      if (hint) hint.textContent = 'D:\\my legal issues 2026\\E-RECEIPTS\\' + estate.folder;
    }
  }

  function updateReceiptPreview() {
    var estate = ESTATES[estateSelect.value] || ESTATES['HNA'];

    var receiptNum    = String(parseInt(receiptNoInput.value) || 1).padStart(4, '0');
    var fullReceiptNo = estate.prefix + receiptNum;
    var tenant        = tenantInput.value.trim()      || '_____';
    var cashChequeVal = cashChequeInput.value.trim()  || '___';
    var signedVal     = signedInput.value.trim()      || '___';
    var monthText     = monthInput.value.trim()       || '_____';
    var formattedDate = formatDate(dateInput.value);

    var balNum = parseFloat(balanceInput.value); if (isNaN(balNum)) balNum = 0;
    var amtNum = parseFloat(amountInput.value);  if (isNaN(amtNum)) amtNum = 0;
    var balDisplay = balNum.toLocaleString('en-UG');
    var amtDisplay = amtNum.toLocaleString('en-UG');

    liveReceiptDiv.innerHTML =
      // 1. Header: name + location + with thanks
      '<div class="receipt-header">' +
        '<div class="apt-name">🏢 ' + escapeHtml(estate.name) + '</div>' +
        '<div class="apt-location">Location: ' + escapeHtml(estate.location) + '</div>' +
        '<div class="thanks-tag">✨ With thanks ✨</div>' +
      '</div>' +

      // 2. E-RECEIPT badge
      '<div class="badge-receipt">📋 E-RECEIPT</div>' +

      // 3. Tenant name (moved up)
      '<div class="receipt-row">' +
        '<span>👥 M/S (Tenant) :</span>' +
        '<span><strong>' + escapeHtml(tenant) + '</strong></span>' +
      '</div>' +

      // 4. Receipt No. + Date
      '<div class="receipt-row">' +
        '<span>🧾 Receipt No. :</span>' +
        '<span><strong>' + escapeHtml(fullReceiptNo) + '</strong></span>' +
        '<span>📆 Date :</span>' +
        '<span><strong>' + escapeHtml(formattedDate) + '</strong></span>' +
      '</div>' +

      // 5. Being payment for month(s)
      '<div class="receipt-row">' +
        '<span>📅 Being payment for the month(s) of :</span>' +
        '<span><strong>' + escapeHtml(monthText) + '</strong></span>' +
      '</div>' +

      // 6. Total amount
      '<div class="receipt-row">' +
        '<span>💰 UGX / Total amount :</span>' +
        '<span class="highlight amount-large">UGX ' + amtDisplay + '</span>' +
      '</div>' +

      // 7. Amount in words
      '<div class="receipt-row">' +
        '<span>📜 The sum of shillings :</span>' +
        '<span><strong>UGX ' + amtDisplay + '</strong><br>(' + numberToWords(amtNum) + ' Shillings only)</span>' +
      '</div>' +

      // 8. Cash/Cheque + Signed + Balance
      '<div class="inline-group">' +
        '<div><strong>💵 Cash/Bank:</strong> ' + escapeHtml(cashChequeVal) + '</div>' +
        '<div><strong>✍️ Signed:</strong> '      + escapeHtml(signedVal)     + '</div>' +
        '<div><strong>⚖️ Bal.:</strong> UGX '    + balDisplay                + '</div>' +
      '</div>' +

      // 9. Contact block
      '<div class="contact-line">' +
        '📞 TEL: ' + escapeHtml(estate.tel) + '<br>' +
        '✉️ Email: ' + escapeHtml(DEFAULT_EMAIL) + '<br>' +
        'Location: ' + escapeHtml(estate.location) +
      '</div>' +

      '<div class="receipt-footer">' +
        '🏁 Official Receipt · ' + escapeHtml(estate.name) + ' · Thank you for your tenancy' +
      '</div>';
  }

  // localStorage tracking
  var STORAGE_KEY = 'ereceiptSavedFiles';
  var savedReceipts = {};
  try { var _s = localStorage.getItem(STORAGE_KEY); if (_s) savedReceipts = JSON.parse(_s); } catch(e) {}

  function persistSaved() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(savedReceipts)); } catch(e) {}
  }

  function getReceiptFilename() {
    var estate = ESTATES[estateSelect.value] || ESTATES['HNA'];
    var num = String(parseInt(receiptNoInput.value) || 1).padStart(4, '0');
    return estate.prefix.replace(':','') + num;
  }

  function updateLastSaved() {
    var estate = ESTATES[estateSelect.value] || ESTATES['HNA'];
    var prefix = estate.prefix.replace(':', '');
    var keys = Object.keys(savedReceipts).filter(function(k) { return k.startsWith(prefix); });
    var el = document.getElementById('lastSavedValue');
    if (!el) return;
    if (keys.length === 0) { el.textContent = 'None'; return; }
    var nums = keys.map(function(k) { var m = k.match(/(\d+)/); return m ? parseInt(m[1]) : 0; });
    el.textContent = prefix + String(Math.max.apply(null, nums)).padStart(4,'0');
  }

  function getNextDuplicateName(base, ext) {
    var count = 1;
    while (savedReceipts[base + '(' + count + ').' + ext]) count++;
    return base + '(' + count + ')';
  }

  function showConfirmPopup(base, ext, onConfirm) {
    var old = document.getElementById('confirmPopup'); if (old) old.remove();
    var popup = document.createElement('div');
    popup.id = 'confirmPopup';
    popup.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:9999;font-family:Segoe UI,system-ui,sans-serif';
    popup.innerHTML = '<div style="background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,0.3);padding:2rem 2.2rem;max-width:420px;width:90%;text-align:center;"><div style="font-size:2.5rem;margin-bottom:0.6rem;">&#128190;</div><div style="font-size:1.1rem;font-weight:700;color:#1e2a3a;margin-bottom:0.5rem;">Save Receipt</div><div style="font-size:0.92rem;color:#555;margin-bottom:1.4rem;line-height:1.6;">Are you sure you want to save this receipt?</div><div style="display:flex;gap:1rem;justify-content:center;"><button id="confirmNo" style="padding:10px 28px;border-radius:20px;border:1px solid #ccc;background:#f5f5f5;font-size:0.95rem;cursor:pointer;font-weight:600;color:#444;">Cancel</button><button id="confirmYes" style="padding:10px 28px;border-radius:20px;border:none;background:#d4af37;color:#fff;font-size:0.95rem;cursor:pointer;font-weight:700;">Yes, Save</button></div></div>';
    document.body.appendChild(popup);
    document.getElementById('confirmYes').onclick = function() { popup.remove(); onConfirm(); };
    document.getElementById('confirmNo').onclick  = function() { popup.remove(); };
    popup.addEventListener('click', function(e) { if (e.target === popup) popup.remove(); });
  }

  function showDuplicatePopup(base, ext, onConfirm) {
    var old = document.getElementById('dupPopup'); if (old) old.remove();
    var nextName = getNextDuplicateName(base, ext);
    var popup = document.createElement('div');
    popup.id = 'dupPopup';
    popup.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:9999;font-family:Segoe UI,system-ui,sans-serif';
    popup.innerHTML = '<div style="background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,0.3);padding:2rem 2.2rem;max-width:420px;width:90%;text-align:center;"><div style="font-size:2.5rem;margin-bottom:0.6rem;">&#9888;&#65039;</div><div style="font-size:1.1rem;font-weight:700;color:#1e2a3a;margin-bottom:0.5rem;">Receipt Already Saved</div><div style="font-size:0.92rem;color:#555;margin-bottom:1.4rem;line-height:1.6;"><strong>' + base + '.' + ext + '</strong> has already been saved.<br>Save a duplicate copy?<br><span style="color:#2c5f7a;font-size:0.85rem;">Will be saved as <strong>' + nextName + '.' + ext + '</strong></span></div><div style="display:flex;gap:1rem;justify-content:center;"><button id="dupNo" style="padding:10px 28px;border-radius:20px;border:1px solid #ccc;background:#f5f5f5;font-size:0.95rem;cursor:pointer;font-weight:600;color:#444;">Cancel</button><button id="dupYes" style="padding:10px 28px;border-radius:20px;border:none;background:#d4af37;color:#fff;font-size:0.95rem;cursor:pointer;font-weight:700;">Yes, Save Copy</button></div></div>';
    document.body.appendChild(popup);
    document.getElementById('dupYes').onclick = function() { popup.remove(); onConfirm(nextName); };
    document.getElementById('dupNo').onclick  = function() { popup.remove(); };
    popup.addEventListener('click', function(e) { if (e.target === popup) popup.remove(); });
  }

  async function doSaveImage(filename) {
    var el = document.getElementById('receiptContainer');
    var prev = el.style.cssText;
    el.style.width = '520px'; el.style.minWidth = '520px'; el.style.maxWidth = '520px';
    var canvas = await html2canvas(el, { scale: 2.5, backgroundColor: '#ffffff', logging: false });
    el.style.cssText = prev;
    var link = document.createElement('a');
    link.download = filename + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    savedReceipts[filename + '.png'] = true;
    persistSaved(); updateLastSaved();
  }

  async function doSavePDF(filename) {
    var el = document.getElementById('receiptContainer');
    var prev = el.style.cssText;
    el.style.width = '520px'; el.style.minWidth = '520px'; el.style.maxWidth = '520px';
    var canvas = await html2canvas(el, { scale: 2.8, backgroundColor: '#ffffff', logging: false });
    el.style.cssText = prev;
    var imgData = canvas.toDataURL('image/png');
    var jsPDF = window.jspdf.jsPDF;
    var pdf = new jsPDF('p','mm','a4');
    pdf.addImage(imgData,'PNG',0,0,210,(canvas.height*210)/canvas.width);
    pdf.save(filename + '.pdf');
    savedReceipts[filename + '.pdf'] = true;
    persistSaved(); updateLastSaved();
  }

  async function downloadReceiptAsImage() {
    var el = document.getElementById('receiptContainer'); if (!el) return;
    try {
      var prev = el.style.cssText;
      el.style.width = '520px'; el.style.minWidth = '520px'; el.style.maxWidth = '520px';
      var canvas = await html2canvas(el, { scale: 2.5, backgroundColor: '#ffffff', logging: false });
      el.style.cssText = prev;
      var link = document.createElement('a');
      link.download = getReceiptFilename() + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    } catch(err) { console.error(err); alert('Could not generate image. See console for details.'); }
  }

  async function downloadReceiptAsPDF() {
    var el = document.getElementById('receiptContainer'); if (!el) return;
    try {
      var base = getReceiptFilename();
      showConfirmPopup(base, 'pdf', async function() {
        if (savedReceipts[base + '.pdf']) { showDuplicatePopup(base, 'pdf', async function(d) { await doSavePDF(d); }); }
        else { await doSavePDF(base); }
      });
    } catch(err) { console.error(err); alert('PDF creation failed.'); }
  }

  function bindEvents() {
    estateSelect.addEventListener('change', function() { updatePrefix(); updateReceiptPreview(); updateLastSaved(); });

    document.getElementById('spinUp').addEventListener('click', function() {
      var v = parseInt(receiptNoInput.value) || 0;
      receiptNoInput.value = v + 1;
      updateReceiptPreview();
    });
    document.getElementById('spinDown').addEventListener('click', function() {
      var v = parseInt(receiptNoInput.value) || 2;
      if (v > 1) receiptNoInput.value = v - 1;
      updateReceiptPreview();
    });
    [receiptNoInput, dateInput, monthInput, tenantInput,
     amountInput, cashChequeInput, signedInput, balanceInput
    ].forEach(function(inp) {
      inp.addEventListener('input',  updateReceiptPreview);
      inp.addEventListener('change', updateReceiptPreview);
    });
    document.getElementById('saveImageBtn').addEventListener('click', downloadReceiptAsImage);
    document.getElementById('savePdfBtn').addEventListener('click',   downloadReceiptAsPDF);
    updateLastSaved();
  }

  function init() {
    setDefaultDate();
    updatePrefix();
    bindEvents();
    updateReceiptPreview();
  }

  document.addEventListener('DOMContentLoaded', init);
</script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
